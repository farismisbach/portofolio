<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Integrated Clean Water web and mobile interface study</title>
  <desc id="desc">A desktop monitor shows a water-management web dashboard with meter readings, customer billing, and payment records. A mobile meter-reading app stands in the foreground.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#274c42" flood-opacity=".16"/></filter>
    <clipPath id="screen"><rect x="56" y="112" width="419" height="216" rx="3"/></clipPath>
    <clipPath id="phone"><rect x="442" y="166" width="112" height="192" rx="13"/></clipPath>
  </defs>
  <g stroke="#adbfba" stroke-width=".7" opacity=".7"><circle cx="329" cy="223" r="166"/><circle cx="329" cy="223" r="124"/><path d="M24 329H610M48 98H598M329 58V383"/></g>
  <g fill="#345b53"><text x="48" y="70" font-family="Georgia,serif" font-size="28" letter-spacing="-.7">Every drop. Accounted for.</text><text x="49" y="87" font-family="monospace" font-size="6.5" letter-spacing="1.7">ONE CONNECTED SYSTEM / WEB + MOBILE + IoT</text></g>
  <!-- Desktop monitor and stand -->
  <ellipse cx="268" cy="365" rx="156" ry="10" fill="#315a4d" opacity=".08"/>
  <path d="M244 328H285L293 355H236Z" fill="#8b9f95"/>
  <path d="M220 354H307L319 361H208Z" fill="#a7b7ac"/>
  <rect x="47" y="103" width="437" height="237" rx="9" fill="#2d413c" filter="url(#shadow)"/>
  <circle cx="265" cy="334" r="2" fill="#8caaa0"/>
  <g clip-path="url(#screen)">
    <path fill="#f5f7f0" d="M56 112H475V328H56Z"/>
    <path fill="#31594e" d="M56 112H475V142H56Z"/>
    <path d="M69 128C69 124 73 120 73 120S77 124 77 128A4 4 0 0 1 69 128Z" fill="#d3dfcf"/>
    <text x="83" y="125" fill="#f0f3e8" font-family="Arial,sans-serif" font-size="6" font-weight="bold">PRIMA LESTARI</text>
    <text x="83" y="133" fill="#b9d0bf" font-family="monospace" font-size="3.5" letter-spacing=".8">WATER MANAGEMENT</text>
    <circle cx="460" cy="127" r="6" fill="#a8c0ad"/>
    <text x="456" y="129" fill="#31594e" font-family="Arial,sans-serif" font-size="4">PL</text>
    <path d="M56 142H139V328H56Z" fill="#eaf0e4"/>
    <text x="66" y="159" fill="#879783" font-family="monospace" font-size="4" letter-spacing=".8">WORKSPACE</text>
    <rect x="62" y="167" width="70" height="15" rx="2" fill="#d7e3d0"/>
    <g font-family="Arial,sans-serif" font-size="5.3" fill="#536f5d"><text x="72" y="177">Overview</text><text x="72" y="199">Meter readings</text><text x="72" y="220">Customers</text><text x="72" y="241">Customer billing</text><text x="72" y="262">Payment records</text><text x="72" y="283">Reports</text></g>
    <g stroke="#7e9782" stroke-width=".7"><rect x="66" y="172" width="3" height="4"/><path d="M66 194H69M66 196H69M66 198H69"/><circle cx="67.5" cy="215" r="1.5"/><path d="M65 219Q67.5 216 70 219"/><rect x="66" y="236" width="3" height="5"/><path d="M65 257H70V261H65ZM65 259H70M66 279H69M66 281H69"/></g>
    <text x="153" y="158" font-family="monospace" font-size="3.8" fill="#8b9b86" letter-spacing=".6">DASHBOARD / WATER OPERATIONS</text>
    <text x="153" y="174" font-family="Arial,sans-serif" font-size="11" fill="#304c3c" font-weight="bold">Water management, connected.</text>
    <text x="153" y="184" font-family="Arial,sans-serif" font-size="4.6" fill="#8b9881">From field readings to customer records.</text>
    <g stroke="#d8e1d0" stroke-width=".7" fill="#fbfcf7"><rect x="153" y="196" width="97" height="40" rx="2"/><rect x="258" y="196" width="97" height="40" rx="2"/><rect x="363" y="196" width="97" height="40" rx="2"/></g>
    <g font-family="monospace" font-size="4" letter-spacing=".6" fill="#829279"><text x="161" y="207">METER READINGS</text><text x="266" y="207">CUSTOMER BILLING</text><text x="371" y="207">PAYMENT RECORDS</text></g>
    <g font-family="Arial,sans-serif" font-size="7.5" fill="#395a43"><text x="161" y="220">Record &amp; review</text><text x="266" y="220">Automatic billing</text><text x="371" y="220">Track payments</text></g>
    <g font-family="Arial,sans-serif" font-size="3.8" fill="#829279"><text x="161" y="228">Connected to the mobile app</text><text x="266" y="228">From usage to customer bills</text><text x="371" y="228">Keep customer records in sync</text></g>
    <rect x="153" y="246" width="195" height="72" rx="2" fill="#fbfcf7" stroke="#d8e1d0" stroke-width=".7"/>
    <text x="161" y="258" font-family="Arial,sans-serif" font-size="5.5" fill="#3d5a43" font-weight="bold">Meter reading records</text>
    <g font-family="monospace" font-size="3.7" fill="#8a9981"><text x="161" y="271">CUSTOMER</text><text x="242" y="271">READING</text><text x="292" y="271">RECORD</text></g>
    <g stroke="#e2e8d9" stroke-width=".6"><path d="M161 275H340M161 289H340M161 303H340"/></g>
    <g font-family="Arial,sans-serif" font-size="4.5" fill="#66805f"><text x="161" y="284">Customer meter</text><text x="161" y="298">Customer meter</text><text x="161" y="312">Customer meter</text><text x="242" y="284">m&#179;</text><text x="242" y="298">m&#179;</text><text x="242" y="312">m&#179;</text><text x="292" y="284">View record</text><text x="292" y="298">View record</text><text x="292" y="312">View record</text></g>
    <rect x="356" y="246" width="104" height="72" rx="2" fill="#e0ead8"/>
    <text x="365" y="258" font-family="Arial,sans-serif" font-size="5.5" fill="#3d5a43" font-weight="bold">Connected in the field</text>
    <g stroke="#7f9a78" stroke-width="1"><path d="M373 278H404V300H438M404 278H438"/><circle cx="373" cy="278" r="6" fill="#edf3e6"/><rect x="399" y="273" width="10" height="10" rx="1" fill="#edf3e6"/><circle cx="438" cy="278" r="5" fill="#edf3e6"/><rect x="433" y="295" width="10" height="10" rx="2" fill="#edf3e6"/></g>
    <g font-family="monospace" font-size="3.5" fill="#5d7b55"><text x="366" y="292">IoT</text><text x="396" y="291">WEB</text><text x="428" y="314">MOBILE</text></g>
  </g>
  <!-- Mobile app in the foreground -->
  <g transform="rotate(7 500 263)">
    <rect x="436" y="160" width="124" height="204" rx="18" fill="#293f36" filter="url(#shadow)"/>
    <g clip-path="url(#phone)">
      <path fill="#f2f7ee" d="M442 166H554V358H442Z"/>
      <text x="450" y="178" font-family="Arial,sans-serif" font-size="4.5" font-weight="bold" fill="#304b39">9:41</text>
      <path d="M535 174V178M538 172V178M541 170V178M545 172H550V177H545Z" stroke="#486247" stroke-width="1"/>
      <text x="451" y="195" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#304b39">Meter readings</text>
      <text x="451" y="206" font-family="monospace" font-size="3.5" letter-spacing=".5" fill="#7c9573">RECORD. SUBMIT. CONNECT.</text>
      <rect x="450" y="217" width="96" height="70" rx="4" fill="#dce8d6"/>
      <circle cx="498" cy="249" r="23" stroke="#bacdb0" stroke-width="4"/>
      <path d="M477 258A23 23 0 1 1 519 240" stroke="#76956a" stroke-width="4"/>
      <text x="498" y="241" text-anchor="middle" font-family="Arial,sans-serif" font-size="4.5" fill="#648358">Water meter</text>
      <text x="498" y="257" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#365832">m&#179;</text>
      <text x="498" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="3.7" fill="#6f8863">Your reading, directly to the database.</text>
      <text x="452" y="299" font-family="Arial,sans-serif" font-size="4.5" fill="#6b815f">New meter reading</text>
      <rect x="450" y="305" width="96" height="17" rx="2" fill="#fbfcf7" stroke="#d5dfcb" stroke-width=".7"/>
      <text x="456" y="316" font-family="Arial,sans-serif" font-size="4.7" fill="#8a9a7d">Enter meter reading</text>
      <rect x="450" y="330" width="96" height="17" rx="3" fill="#456c42"/>
      <text x="498" y="341" text-anchor="middle" font-family="Arial,sans-serif" font-size="5" fill="#f4f6eb">Save reading</text>
    </g>
    <rect x="481" y="166" width="34" height="6" rx="3" fill="#293f36"/>
    <path d="M485 354H511" stroke="#9aae91" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g font-family="monospace" font-size="6" fill="#5f8073" letter-spacing="1"><text x="48" y="383">WEB DASHBOARD</text><text x="443" y="383">METER-READING APP</text></g>
</svg>
